# Keep the evalguard acceptance checks independent of cloud services and credentials.
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: make lint
      - run: make test
      - run: make dev
      - run: docker build .
