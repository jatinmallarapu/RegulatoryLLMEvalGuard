# Package the evalguard entry point so the demo runs from an installed environment.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatoryllmevalguard"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
evalguard = "evalguard:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "pre-commit>=4,<5"]

[tool.setuptools]
py-modules = ["evalguard"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
